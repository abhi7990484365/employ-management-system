<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Management</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><div><small>ADMIN PORTAL</small><h1>Employee Management</h1></div><span id="count">0 employees</span></header>
<section><h2 id="form-title">Add employee</h2><form id="form"><input id="employee-id" type="hidden">
<label>Full name<input id="name" required minlength="2" placeholder="Alex Morgan"></label>
<label>Email address<input id="email" type="email" required placeholder="alex@example.com"></label>
<label>Department<input id="department" required minlength="2" placeholder="Engineering"></label>
<button id="save" type="submit">Save employee</button><button id="cancel" type="button" hidden>Cancel</button><p id="message" role="status"></p></form></section>
<section><div class="list-head"><h2>Employees</h2><input id="search" type="search" aria-label="Search employees" placeholder="Search by name"></div>
<table><thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="/static/app.js"></script></body></html>
